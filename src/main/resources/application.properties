spring.application.name=healthcare

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/healthcare_db?currentSchema=healthcare_db&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=healthcare_user
spring.datasource.password=healthcare_user
spring.jpa.hibernate.ddl-auto=update
